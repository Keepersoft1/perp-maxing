name: Elysium hub data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          mkdir -p elysium/vendor
          [ -f elysium/vendor/chart.umd.min.js ] || curl -sL https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js -o elysium/vendor/chart.umd.min.js
      - run: python scripts/elysium_hub.py
      - run: |
          git config user.name "elysium-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add elysium/data elysium/logos elysium/vendor
          git diff --cached --quiet || (git commit -m "Elysium hub data update" && git pull --rebase && git push)
