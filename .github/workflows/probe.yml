name: Probe (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p data/probe
          for a in 0x5227f603c1ee34ce3c06efe6477003bdfccb2f8c 0x8532fa14acaf483729c449b8458aeddb900543d4; do
            curl -s -D data/probe/$a.headers "https://eth.blockscout.com/api/v2/addresses/$a" -H "Origin: https://perpmaxing.com" -o data/probe/$a.addr.json
            curl -s "https://eth.blockscout.com/api/v2/addresses/$a/token-balances" -o data/probe/$a.tokens.json
            curl -s "https://eth.blockscout.com/api/v2/addresses/$a/token-transfers" -o data/probe/$a.transfers.json
            curl -s "https://eth.blockscout.com/api/v2/addresses/$a/transactions" -o data/probe/$a.txs.json
            curl -s "https://eth.blockscout.com/api/v2/addresses/$a/counters" -o data/probe/$a.counters.json
          done
          git config user.name "perp-maxing-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/probe; git commit -m "probe" || exit 0; git pull --rebase -q && git push
