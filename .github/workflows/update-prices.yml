name: Update prices and volume

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install telethon==1.36.0
      - name: Read OTC groups and update prices
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: python scripts/update_prices.py
      - name: Update volume from DefiLlama
        continue-on-error: true
        run: python scripts/update_volume.py
      - name: Commit if changed
        run: |
          git config user.name "perp-maxing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data logos
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "data: hourly prices + volume update"
            git push
          fi
