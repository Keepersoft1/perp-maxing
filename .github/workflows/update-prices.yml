name: Update OTC prices

on:
  schedule:
    - cron: "7 * * * *"   # every hour at :07
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read OTC channels and update prices
        run: python scripts/update_prices.py
      - name: Commit if changed
        run: |
          git config user.name "perp-maxing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/prices.json logos
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "prices: hourly OTC update"
            git push
          fi
