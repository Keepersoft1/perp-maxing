name: Volume history (manual)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lp_logos.py
      - run: |
          git config user.name "perp-maxing-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/lp3
          git commit -m "Volume history snapshot" || exit 0
          git pull --rebase -q && git push
